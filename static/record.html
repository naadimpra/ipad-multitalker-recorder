<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>iPad Recorder</title><link rel="stylesheet" href="/static/app.css">
</head><body><main>

<div id="tech">
  <div id="status">Not armed</div>

  <section class="card" id="setup">
    <div class="chips" id="posChips"></div>
    <input id="label" placeholder="Device name (e.g. spk1, alice, center)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24">
    <input id="speaker" placeholder="Participant ID (optional)" autocomplete="off" autocapitalize="off">
    <div id="micRow" hidden><select id="mic"><option value="">Default microphone</option></select></div>
    <button class="big" id="arm">Arm microphone</button>
  </section>

  <section class="card">
    <div class="meter"><div id="lvl"></div></div>
    <div class="row" style="margin-top:8px"><span id="info" class="muted grow">–</span><span id="db" class="muted">–</span></div>
    <p id="quietWarn" class="msg err" style="display:none;margin:10px 0 0">Very quiet — move the iPad closer to the speaker.</p>
  </section>

  <section class="card" id="review" hidden>
    <div class="row"><b>Last take</b><span id="revInfo" class="muted grow" style="text-align:right"></span></div>
    <audio id="revAudio" controls preload="none" playsinline style="width:100%;margin-top:10px"></audio>
  </section>

  <button class="big ghost" id="flipBtn" hidden>Flip screen</button>
  <button class="big ghost" id="toPart">Participant view  ›</button>
</div>

<div id="pview">
  <div id="pbar">
    <button id="pback" class="pback" aria-label="Back">‹</button>
    <div id="pcenter"><span id="pdot"></span><span id="ptime">0:00</span><span id="pchip"></span></div>
    <div class="plang" role="group" aria-label="Language">
      <button data-lang="ja">日本語</button><button data-lang="en">English</button>
    </div>
  </div>
  <div class="pmeter"><div id="plvl"></div></div>
  <div class="phint" id="phint"></div>
  <div class="emo-grid" id="emoGrid"></div>
</div>
</main>
<div id="rotate" hidden data-state="start" role="status" aria-live="polite">
  <svg id="rotSvg" viewBox="-160 -160 320 320">
    <defs>
      <marker id="rotHead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
        <path d="M1 1L9 5L1 9z" fill="context-stroke"/>
      </marker>
    </defs>
    <!-- everything in rotWorld counter-rotates, so it stays put on the table (and readable) while the iPad turns -->
    <g id="rotWorld">
      <g id="rotTicks"></g>
      <path id="rotArc" fill="none" stroke-width="7" stroke-linecap="round" marker-end="url(#rotHead)"/>
      <g id="rotYou" transform="translate(0 128)">
        <circle r="20" fill="#fff"/>
        <circle cy="-5" r="6" fill="#0b0d10"/><path d="M-11 12a11 9 0 0 1 22 0z" fill="#0b0d10"/>
      </g>
      <g id="rotRip" fill="none" stroke="#fff" stroke-width="3"><circle r="60"/><circle r="60"/><circle r="60"/></g>
      <text id="rotDeg" y="18" text-anchor="middle">180°</text>
      <text id="rotLbl" y="56" text-anchor="middle">Turn your iPad around</text>
      <g id="rotTick"><circle r="54" fill="#fff"/><path d="M-24 1l16 16 32-34" fill="none" stroke="#1f9d55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></g>
      <!-- the mic is fixed to the iPad's top edge, so it turns with the iPad: rotated back by the turn -->
      <g id="rotMicArm"><g transform="translate(0 -128)">
        <circle r="22" fill="#0a84ff"/>
        <rect x="-6" y="-13" width="12" height="18" rx="6" fill="#fff"/>
        <path d="M-11 -1a11 11 0 0 0 22 0M0 10v5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      </g></g>
    </g>
  </svg>
  <button id="rotAlready">Mic already faces me</button>
  <button id="rotDone" aria-label="Done"><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<script type="module" src="/static/record.js"></script>
</body></html>
